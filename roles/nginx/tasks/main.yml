- name: Instalar nginx y curl
  ansible.builtin.apt:
    name: [nginx, curl]
    state: present
    update_cache: true

- name: Página de bienvenida desde plantilla
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    mode: "0644"
  notify: Recargar nginx

- name: Arrancar nginx si no está corriendo
  ansible.builtin.shell: |
    if [ -f /run/nginx.pid ] && kill -0 "$(cat /run/nginx.pid)" 2>/dev/null; then
      echo running
    else
      nginx && echo started
    fi
  register: nginx_start
  changed_when: "'started' in nginx_start.stdout"
  
- name: Guardar token de la aplicación
  ansible.builtin.copy:
    content: "{{ app_token }}\n"
    dest: /etc/nginx/app_token
    mode: "0600"
  no_log: true